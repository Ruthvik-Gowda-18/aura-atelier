<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="url(#bgGradient)" stroke="#27272A" stroke-width="1.5" />
  <!-- Monogram A -->
  <g filter="url(#subtleGlow)">
    <path d="M32 14 L46 48 L40.5 48 L36.8 38.5 L27.2 38.5 L23.5 48 L18 48 Z M32 23 L28.8 34 L35.2 34 Z" fill="url(#goldGradient)" />
    <!-- Fine inner cross accent -->
    <circle cx="32" cy="18" r="1.5" fill="#FFFFFF" opacity="0.8" />
  </g>
</svg>